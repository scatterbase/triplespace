# Read the Docs builds the documentation site (0109; 24 §16) from mkdocs.yml on every push to main
# and on every pull request. Its generated pages (tools/docs_site.py) read the repository as
# checked out, so they describe the commit being built.
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
mkdocs:
  configuration: mkdocs.yml
python:
  install:
    - requirements: docs/requirements.txt
