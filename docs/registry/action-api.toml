changes = "WikibaseQualityConstraints' module, in its shape: `id`, `claimid`, `constraintid`, `status`, returning per-statement results with `status` (`violation`, `warning`, `suggestion`, `compliance`, `exception`, `not-in-scope`, `todo` for an unbound type) and the constraint's clarification, so that the gadgets and tools that read it work"
sources = "[0031](../decisions/0031-property-constraints.md) §6"

[[module]]
kind = "wikibase"
modules = ["wbeditentity"]
changes = "Diffed against the resolved view and mapped by ownership as §2.5 says; an echoed entity is a no-op. `sitelinks` entries may carry `url` in place of `site`+`title`. `new=lexeme`, or on `L` IDs. Terms on `M`"
sources = "[0084](../decisions/0084-wikibase-writes-against-the-resolved-view.md) §1, §2; [0026](../decisions/0026-sitelinks.md) §7; [0066](../decisions/0066-lexemes.md) §8; [0065](../decisions/0065-mediainfo-captions-and-commons.md) §4"

[[module]]
kind = "wikibase"
modules = ["wbgetentities"]
changes = "**Answers under the requested ID.** `ids=` accepts any member of a cluster (§1.4); a request for a non-canonical member returns the fused body under that ID, with a `canonical` field naming the cluster's canonical member and statement GUIDs prefixed with the requested ID, rewritten to the request's form (§1.6). Wikibase's redirect shape (`redirects: {from, to}`, the entity keyed by its target) is reserved for true redirects, a `redirect` operation, an upstream merge or a key-mapped provider's own item ID (`XDQ9` answers as `domain:example.org`, [05](05-providers-and-ingest.md) §4.1; [0009](../decisions/0009-keyed-entity-types-and-domain.md) A14), so a Wikidata-keyed client never meets `IsRedirectPageError` on a clustered item. `sitefilter` accepts alias IDs and hosts; `sites` and `titles` (lookup by sitelink) accept both forms, and find a page's paired item; a `urls` parameter looks up by URL. A `resolver` and `key` pair of parameters, mirroring `sites`+`titles`, returns the entity when the lookup is unique and `missing` with a `candidates` list otherwise. `missing` for a deleted local entity. On `WDM`, `E` and `L` IDs as §2.1. `ids=mhc:Q1`: a source entity from the tenant's view; one not yet held is `missing`, and is enqueued when the source's mirror setting is `on-demand` or above"
sources = "[0026](../decisions/0026-sitelinks.md) §7; [0029](../decisions/0029-resolver-namespaces.md) §6; [0023](../decisions/0023-moderation.md) §8; [0038](../decisions/0038-page-metadata-and-categories.md) §13; [0064](../decisions/0064-entityschema-and-validation.md) §7; [0065](../decisions/0065-mediainfo-captions-and-commons.md) §4; [0066](../decisions/0066-lexemes.md) §8; [0078](../decisions/0078-entity-sources.md) §10"

