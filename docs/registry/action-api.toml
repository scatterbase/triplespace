[[module]]
kind = "action"
modules = ["action=parse"]
changes = "Accepts the `markdown` and `yaml` content models; `contentmodel` accepts text models only. Reports the renderer version, so that the in-browser preview can detect a mismatch. Renders with expansion; gains `prop=templates`, `limitreportdata`, `limitreporthtml` and `parsetree`; `pst`, `onlypst` and `preview` as in MediaWiki; `parsoid=1` returns Parsoid's HTML where the tenant has it configured; runs Lua when `wikitext.lua` is on. `redirects` parses the target. On a foreign title: the rewritten HTML, `categories`, `templates`, `images`, `langlinks`, `properties` and `revid` from the bundle, `prop=wikitext` the source. On a table: the grid's first page as static HTML, without editing controls `tsstyles=link` writes each TemplateStyles sheet as a `<link rel=\"stylesheet\">` to its `/w/styles/` address instead of an inline `<style>` element, for the site; the default is MediaWiki's inline element ([0055](../decisions/0055-templatestyles-templatedata-and-page-properties.md) A5)."
sources = "[0012](../decisions/0012-api-requirements.md) §4; [0041](../decisions/0041-content-models.md) §8; [0042](../decisions/0042-template-expansion-and-parsoid.md) §14; [0043](../decisions/0043-lua-modules.md) §16; [0045](../decisions/0045-table-content-model.md) §9; [0051](../decisions/0051-page-redirects.md) §7; [0053](../decisions/0053-mirrored-pages.md) §10"

