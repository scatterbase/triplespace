changes = "Pages, threads and entity pages. `deletetalk=1` writes the second record of [0023](../decisions/0023-moderation.md) §2. Gains `oldimage` for one old file version. Addresses a redirect page itself. On a foreign primary: `ts-foreign-page`"
sources = "[0023](../decisions/0023-moderation.md) §8; [0039](../decisions/0039-files-and-media.md) §17; [0051](../decisions/0051-page-redirects.md) §7; [0052](../decisions/0052-page-repositories-and-title-inheritance.md) §6"

