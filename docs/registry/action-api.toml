changes = "`contentmodel` for every page ID: document, entity, thread, talk and file pages. `inprop=protection` reports the page's or entity's edit and move ACLs as MediaWiki `protection` entries, and a `read` restriction as an entry of type `read` to principals that may read the page, which is every principal that can ask about it. `inprop=watched|notificationtimestamp`, for a missing title too, with `watchlistexpiry` and Triplespace's `ts-notify` ([0020](../decisions/0020-change-feeds.md) A18). `inprop=linkclasses`, reporting `mw-redirect`. The `redirect` flag. `origin`: the repository name, `local` for a local page; `forkedfrom` beside it. For a foreign primary: `pageid`, `lastrevid`, `touched`, `length`, `contentmodel` (the upstream page's), `redirect`"
sources = "[0016](../decisions/0016-permissions-and-access-control.md) §7; [0020](../decisions/0020-change-feeds.md) §5; [0023](../decisions/0023-moderation.md) §8; [0041](../decisions/0041-content-models.md) §8; [0042](../decisions/0042-template-expansion-and-parsoid.md) §14; [0051](../decisions/0051-page-redirects.md) §7; [0052](../decisions/0052-page-repositories-and-title-inheritance.md) §6; [0054](../decisions/0054-forking-a-mirrored-page.md) §11; [0056](../decisions/0056-security-model.md) §13"

