[[module]]
kind = "action"
modules = ["action=clientlogin", "action=createaccount", "meta=authmanagerinfo"]
changes = "Offer a redirect-based OAuth flow for each issuer allowed for login, and MediaWiki's own `username`/`password` fields where the built-in `password` issuer is on. These are not offered to subsidiaries. `returnto` is honoured only on the request's own origin, here and on the `/auth` routes, and ignored otherwise ([0057](../decisions/0057-web-tier.md) §7). Unchanged by the OAuth server. Where a challenge trigger applies to the caller ([07](07-actors-and-accounts.md) §2.6), `authmanagerinfo` (`amirequestsfor=create`, or `login` under `badlogin`) lists the required `TriplespaceChallengeAuthenticationRequest`, with `tschallengeid` (hidden, the challenge), `tschallengeinfo` (`null`, labelled with what to compute) and `tschallengesolution`, and `metadata` `{\"algorithm\": \"sha256-leading-zero-bits\", \"bits\", \"expires\"}`; a solution that is missing, wrong, stale or spent answers `status: UI` with `ts-challenge-required` and a fresh challenge, for `createcontinue` or `logincontinue`, as ConfirmEdit answers a wrong CAPTCHA. `createaccount` is throttled by the `createaccount` class, answering `FAIL` with `acct_creation_throttle_hit`; with `account.approval` on, it answers `FAIL` with `ts-account-requested`, and a login with the credential of a pending or rejected request answers `FAIL` with `ts-account-pending` or `ts-account-rejected` and the reviewer's reason. `uiprop=cancreateaccount` answers from `createaccount` alone. **At the auth base and on tenants** ([07](07-actors-and-accounts.md) §2.8; [0089](../decisions/0089-the-auth-host-and-instance-logins.md) §7, §11): at the auth base these modules act on logins, and `createaccount` creates one, under the `createaccount` challenge for a password. On a tenant with an auth host, `clientlogin` keeps the `username` and `password` fields, the username being the tenant account's name and the password its login's, under the tenant's `badlogin`, and opens a tenant session only; `authmanagerinfo` lists the built-in issuer `login`, whose redirect goes to the auth host's `/auth/authorize`, and no external issuer and no password field for `create`; `createaccount` with a password answers `ts-auth-host`, which carries the auth base. **External issuers** ([07](07-actors-and-accounts.md) §2.7): for each the auth host offers, and for `login` on a tenant, `authmanagerinfo` lists `TriplespaceIssuerAuthenticationRequest:{issuer}`, one `button` field `tsissuer-{issuer}` labelled with the issuer's name, for `login`, `create` and `link`; with that field and a `loginreturnurl` or `createreturnurl` on the request's origin (else `ts-oauth-returnurl`), the module answers `status: REDIRECT` with the provider's URL and a continue request whose one field is `state`, which the callback appends to the return URL for `logincontinue` or `createcontinue`. On a tenant, a login with no account there answers `RESTART` (`authmanager-authn-no-local-user-link`) and stays the session's pending login, and `createaccount` with `createpreservestate=1` and `username` creates the account bound to it, with no password and no challenge; at the auth base an identity bound to no login does the same, and creates a login. `ts-oauth-denied`, `ts-oauth-state`, `ts-oauth-failed`, `ts-oauth-bound`, and for vouching `ts-reclaimed`, `ts-reclaim-taken`, `ts-reclaim-unavailable`"
sources = "[0012](../decisions/0012-api-requirements.md) §4; [0025](../decisions/0025-oauth-server.md) §9; [0087](../decisions/0087-account-registration-and-challenges.md) §9; [0088](../decisions/0088-external-identity-providers.md) §5, §6, §8; [0089](../decisions/0089-the-auth-host-and-instance-logins.md) §5, §7, §11"

[[module]]
kind = "action"
modules = ["action=compare"]
changes = "For document pages, as in MediaWiki. For entities, a diff of the canonical JSON of the local graph's assertions, each side read as one row of `view.entity_revision` (§1.3): Wikibase JSON with sorted keys, one value to a line, without `lastrevid`, `modified`, `pageid`, `ns` and `title`, which change with every revision; the \"JSON\" view of [19](19-site-ui.md). An entity's revisions are its local ones, as `prop=revisions` lists them; one with none is `ts-no-local-revision`; the statement view is served over REST (§5.1). `contentmodel` accepts text models only; `fromslots` and `toslots` take `main` and `mediainfo`. Seeded fork revisions appear with their ranged IDs"
sources = "[0012](../decisions/0012-api-requirements.md) §4; [0041](../decisions/0041-content-models.md) §8; [0054](../decisions/0054-forking-a-mirrored-page.md) §11"

[[module]]
