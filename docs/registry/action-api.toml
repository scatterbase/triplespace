[[module]]
kind = "query"
modules = ["prop=revisions"]
changes = "Local revisions only: the local graph for entities, the `pages` partition for document pages; `rvprop=content` at any `oldid` is one row of `view.entity_revision` (§1.3), never a replay. An erased part sets its MediaWiki hidden flag, `texthidden` for the content, `commenthidden` for the comment, `userhidden` for the attestation, and a new `erased` flag is set with it; that a record was erased is shown to everyone. New `rvprop` values: `source`, `job` and `operator`. `rvprop=record` returns the revision's `{partition, offset}`, which the site's diff page resolves a revision ID through ([0012](../decisions/0012-api-requirements.md) A74). `rvslots` takes `main` and, on File pages, `mediainfo`; `rvprop=contentmodel` is per slot; `rvprop=content` returns the serialization of [0041](../decisions/0041-content-models.md) §5. A talk page's rows are its threads' revisions and carry their content. A definition page's rows carry the definition as of each revision (a table's with `contentmodel` `triplespace-table`, `contentformat` `application/json`). For a foreign primary: the latest upstream revision, with `rvprop=content` the wikitext, `user` the upstream actor under its issuer and `comment` the upstream summary; older revisions are not held, and a request for them is answered with the latest and a warning, `ts-foreign-history`, naming the upstream history URL. Seeded fork revisions appear with ranged IDs. A deleted local entity's page answers as a deleted page"
sources = "[0012](../decisions/0012-api-requirements.md) §4; [0023](../decisions/0023-moderation.md) §8; [0041](../decisions/0041-content-models.md) §8; [0045](../decisions/0045-table-content-model.md) §9; [0052](../decisions/0052-page-repositories-and-title-inheritance.md) §6; [0053](../decisions/0053-mirrored-pages.md) §10; [0054](../decisions/0054-forking-a-mirrored-page.md) §11; [0060](../decisions/0060-scopes.md) §8; [0061](../decisions/0061-sprints-and-tasks.md) §10; [0063](../decisions/0063-query-namespace.md) §7"

