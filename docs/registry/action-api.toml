changes = "On a followed talk title, `discussiontoolsedit` with `paction=addcomment` or `addtopic` is the same operation as `POST /thread/{id}/upstream-reply` and `POST /page/{id}/upstream-topic`, so DiscussionTools-based clients (the reply tool, Convenient Discussions) work on a followed talk page as on the wiki; `discussiontoolspageinfo` on that title returns the foreign threads' items as upstream does, with local threads omitted"
sources = "[0069](../decisions/0069-synchronized-talk-pages.md) §9"

