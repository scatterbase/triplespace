[[module]]
kind = "query"
modules = ["list=recentchanges"]
changes = "One row per local revision, as in MediaWiki. Job changes carry the `bot` flag and a `job:{id}` tag. `rcjob` filters by job. Mirror records never appear by default; each mirror job run appears as a `job` log event, and `rckind=edit|sync|log|job|erased` selects the row kinds of `view.activity` directly, `sync` included, since `rctype=external` is not used, because Wikibase clients already give it a meaning ([0012](../decisions/0012-api-requirements.md) A73). `rcshow=patrolled|!patrolled|autopatrolled` and `rcprop=patrolled`; `rcprop` also takes `source`, `job` and `operator`, as `prop=revisions` does. `rcscope` serves a scope's related changes ([0060](../decisions/0060-scopes.md) §7)"
sources = "[0012](../decisions/0012-api-requirements.md) §4, A73; [0023](../decisions/0023-moderation.md) §8; [0060](../decisions/0060-scopes.md) §8"

