[[module]]
kind = "action"
modules = ["action=protect"]
changes = "`protections=edit=autoconfirmed|move=sysop`, `expiry`, `reason`; writes or retires the ACL. `read={group}` in `protections`, with `expiry` as for the others, writes a confidential restriction; MediaWiki clients that do not know it never send it. `cascade=1` is refused with `ts-no-cascade`, since there is no cascading protection. On a title that does not exist, reserves a page ID ([09](09-security-and-moderation.md) §4.8). On an entity page, restricts `edit` on the entity target (an `entity` ACL). On a foreign primary, refused with `ts-foreign-page` except create-protection"
sources = "[0016](../decisions/0016-permissions-and-access-control.md) §7; [0023](../decisions/0023-moderation.md) §8; [0056](../decisions/0056-security-model.md) §13; [0052](../decisions/0052-page-repositories-and-title-inheritance.md) §6"

[[module]]
kind = "action"
modules = ["action=purge"]
changes = "A plain purge bumps the render epoch and purges the page's tag; `forcelinkupdate` and `forcerecursivelinkupdate` also queue refreshes. By `POST` without a token, for any principal who may read the page, in the `parse` rate class ([0057](../decisions/0057-web-tier.md) §14). On a mirrored page, refetches the bundle ([0053](../decisions/0053-mirrored-pages.md) §6)"
sources = "[0042](../decisions/0042-template-expansion-and-parsoid.md) §14; [0053](../decisions/0053-mirrored-pages.md) §10"

