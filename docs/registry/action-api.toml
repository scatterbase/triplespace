changes = "Ends the session. At the auth base, `everywhere=1` ends every session of the login, there and on every tenant; on a tenant, the tenant's session only, and the page offers the auth host's **Log out everywhere**"
sources = "[0012](../decisions/0012-api-requirements.md) §4; [0089](../decisions/0089-the-auth-host-and-instance-logins.md) §9"

