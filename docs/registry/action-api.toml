[[module]]
kind = "action"
modules = ["action=linkaccount", "action=unlinkaccount", "action=removeauthenticationdata", "action=changeauthenticationdata"]
changes = "Manage **bindings**, the private sign-in methods of [0007](../decisions/0007-actor-identity.md) §3, because that is what these modules mean in MediaWiki. They act on the login of the session, at the auth base only; on a tenant with an auth host they answer `ts-auth-host` ([07](07-actors-and-accounts.md) §2.8). `changeauthenticationdata` sets the login's password, and changing or removing a method ends the login's other sessions. They never create or remove the public account links of [0007](../decisions/0007-actor-identity.md) §7. `linkaccount` with the issuer's button field and `linkreturnurl` adds a binding through the redirect flow, continued by `linkcontinue`; a subject bound to another login is `ts-oauth-bound-elsewhere`. `unlinkaccount` takes `request=TriplespaceIssuerAuthenticationRequest:{issuer}`, which `authmanagerinfo&amirequestsfor=remove` lists per binding, and erases the binding record. Removing the last way to log in, counting a password, is refused with `ts-last-binding`"
sources = "[0012](../decisions/0012-api-requirements.md) §4; [0088](../decisions/0088-external-identity-providers.md) §7; [0089](../decisions/0089-the-auth-host-and-instance-logins.md) §3, §7"

