# Themes: palettes and type sets, values for Codex design tokens.  ADR 0034 §1; ADR 0086.
#
# A palette sets Codex's colour tokens, per variant, and the shape tokens (radii); a type set sets the
# typeface tokens and lists the typefaces it serves. Neither sets a component's markup or behaviour. An
# instance or a tenant adds its own as `palette` and `typeset` config records of the same shape (0086 §1);
# this file is the registry an instance's `config` starts from and is synced against (23 §4.1).
#
# Keys are Codex token names without the leading `--`, as @wikimedia/codex-design-tokens names them; a key
# Codex does not define is an error when the site builds its stylesheet. Tokens a variant does not name keep
# Codex's values for that mode: `light` overlays theme-wikimedia-ui.css, `dark` overlays
# theme-wikimedia-ui-mode-dark.css, and `light-more` and `dark-more` overlay this palette's own `light` and
# `dark`. A palette without `dark` takes the default palette's (0086 §2).
#
# Contrast (0086 §2). Each variant is checked as served, merged over Codex's values for its mode. In `light`
# and `dark` every text pair meets WCAG 2.1 AA (4.5:1) and the boundaries of controls and the focus outline
# 3:1 (WCAG 1.4.11); in `light-more` and `dark-more` text meets 7:1 (AAA, 1.4.6) and those boundaries 4.5:1.
# The pairs are crates/triplespace-ui/src/theme.rs's TEXT_PAIRS and UI_PAIRS, plus button labels
# (`color-inverted-fixed`, white in every mode, on `background-color-progressive` and its hover and active
# states, and on `background-color-destructive`) and the error, destructive and success colours on the page
# and on their subtle backgrounds.
#
# A palette may extend another (`extends`): each of its variants overlays the same variant of the palette it
# extends, so an accessibility palette states only the colours it changes. `accessibility = true` marks a
# palette or type set a reader may always choose (0086 §2–4).
#
# Typefaces are served by the site from its own origin, as CSP requires (0034 §11); a tenant's own are site
# assets (0085 §8). Each carries an allow-listed licence (OFL-1.1, Apache-2.0, UFL-1.0), which permits bundling
# with GPL software.

version = 2

# The version-1 theme `default` is the palette `parchment` with the type set `default26`; its name is kept,
# retired, so it is never given another meaning.
[theme.default]
retired = true
replaced_by = ["palette.parchment", "typeset.default26"]

