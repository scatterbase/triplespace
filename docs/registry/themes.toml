# --- Other palettes ----------------------------------------------------------------------------------

# Inspired by Vector 2022, the skin of Wikipedia since 2023, and named `encyclopedia` (James, 2026-10-25;
# 0086 A2): Codex's own colours, which Vector 2022 wears, changed only where they miss the floors of 0086 §2,
# with Codex's dark mode (Wikipedia's night mode) and high-contrast variants in the same greys and blues.
# Square-cornered, as Vector's controls are.
[palette.encyclopedia]
label = "Encyclopedia"
border-radius-base = "2px"

# Codex's light values; only the base border darkens, from #A2A9B1 (2.37:1) to 3:1. Dividers keep #A2A9B1.
[palette.encyclopedia.light]
border-color-base = "#8C959F"

# Codex's dark values (theme-wikimedia-ui-mode-dark), with the placeholder and the focus outline, which
