# Every permission the ADRs name (chapter 09 §2.2). `groups.toml` is the registry of record for which
# groups hold a permission by default; this file holds what each permission allows. Edit it, then
# `python3 architecture/catalogues.py --write` from docs/ regenerates the table in 09 §2.2, whose
# 'Granted by default to' column is derived from groups.toml. The generator checks that every
# permission a group grants is listed here, and every permission here is granted by some group or
# marked `ungranted = true`. `granted_note` is appended verbatim to the derived groups (so it starts
# with its own punctuation), for what groups.toml cannot say: owner only, a farm global group, none.
# 
# names   the permission(s) the row covers
# new     true for a permission that is Triplespace's own (marked *(new)* in the table)
# allows  what it allows, with citations
# sources the ADR sections that define it

[[permission]]
names = ["read"]
allows = "Reading anything public. Every public feed, including the stream; the discovery endpoints of notifications; reading a foreign page, whose repository's content is public by definition; export from the report forms; exporting a proposal"
sources = "[0016](../decisions/0016-permissions-and-access-control.md) §2; [0020](../decisions/0020-change-feeds.md) §7; [0021](../decisions/0021-notifications.md) §9; [0047](../decisions/0047-special-pages.md) §12; [0052](../decisions/0052-page-repositories-and-title-inheritance.md) §9; [0053](../decisions/0053-mirrored-pages.md) §11; [0067](../decisions/0067-proposals.md) §8"

[[permission]]
names = ["edit"]
allows = "Local-graph `add`, `remove` and `override` on any subject; page `edit`. On threads: `create`, `post` (including a status), and `edit` of one's own posts; a board's definition; `create` with `also` needs `edit` on the home and on each listed target. Asserting, changing and removing a page's statements, including `page-alternates`. Editing a `sanitized-css` page and the site-styles page. Editing a scope. Opening a proposal on the subject's talk page; replying upstream from a synchronized talk page; `follow` on a fork. Forking, with `createpage`"
sources = "[0016](../decisions/0016-permissions-and-access-control.md) §2; [0019](../decisions/0019-discussions.md) §12; [0049](../decisions/0049-boards.md) §13; [0038](../decisions/0038-page-metadata-and-categories.md) §14; [0052](../decisions/0052-page-repositories-and-title-inheritance.md) §9; [0055](../decisions/0055-templatestyles-templatedata-and-page-properties.md) §8; [0060](../decisions/0060-scopes.md) §9; [0067](../decisions/0067-proposals.md) §8; [0069](../decisions/0069-synchronized-talk-pages.md) §11; [0054](../decisions/0054-forking-a-mirrored-page.md) §8"

[[permission]]
names = ["createpage"]
allows = "Page `create`; creating a board (namespace 310) or a scope (namespace 312); forking a mirrored page, with `edit`"
sources = "[0016](../decisions/0016-permissions-and-access-control.md) §2; [0049](../decisions/0049-boards.md) §13; [0060](../decisions/0060-scopes.md) §9; [0054](../decisions/0054-forking-a-mirrored-page.md) §8"

