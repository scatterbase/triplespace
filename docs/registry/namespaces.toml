# Default namespaces.  ADR 0008 §2 (as amended 2026-09-27), 0009 §11, 0017 §5, 0019 §2–3, 0029 §2.
#
# kind        "entity" | "document" | "reserved" | "virtual" | "composite" | "thread" | "resolver"
# normalizer  "first-letter" | "entity-id" | a keyed type's or resolver's name (0008 §3)
# case        What meta=siteinfo reports: "first-letter" | "case-sensitive"
# talk        The paired talk namespace, a composite of attached threads (0008 §2, 0019 §2)
#
# Numbering policy (0008 §2, amended 2026-09-27):
#   - Every number MediaWiki core or any Wikibase extension uses is RESERVED: listed here with
#     kind "reserved", never given another meaning, and not implemented unless an ADR says so.
#     Its odd-numbered talk namespace is not enabled either.
#   - Talk namespaces (odd numbers) exist for implemented subject namespaces only.
#   - 210–219 are Triplespace-specific namespaces; 220–229 are resolver prefixes (0029).
#     Registered on mediawiki.org's Extension default namespaces page; as of 2026-09-27 the page
#     lists nothing between 204 and 240.
#   - The local name of Project is the site name (0008 §7) and is set per instance.

version = 1

# --- MediaWiki core ---------------------------------------------------------------------------
[[namespace]]
id = -2
canonical = "Media"
kind = "reserved"           # core; no uploads (0008 §2)

[[namespace]]
id = -1
canonical = "Special"
kind = "virtual"

[[namespace]]
id = 0
canonical = ""
kind = "reserved"           # the main namespace; reserved, not implemented; Talk (1) not enabled

[[namespace]]
id = 2
canonical = "User"
kind = "document"
normalizer = "first-letter"
case = "first-letter"
subpages = true
content_models = ["wikitext", "markdown", "json", "yaml", "text"]
default_model = "wikitext"
talk = 3
creation_rule = "owner-exists"   # 0008 §6

[[namespace]]
id = 3
canonical = "User talk"
kind = "composite"

[[namespace]]
id = 4
canonical = "Project"
kind = "document"
normalizer = "first-letter"
case = "first-letter"
subpages = true
content_models = ["wikitext", "markdown", "json", "yaml", "text"]
default_model = "wikitext"
talk = 5

[[namespace]]
id = 5
canonical = "Project talk"
kind = "composite"

[[namespace]]
id = 6
canonical = "File"
kind = "reserved"           # core; no uploads

[[namespace]]
id = 8
canonical = "MediaWiki"
kind = "reserved"           # core; interface messages are not pages here

[[namespace]]
id = 10
canonical = "Template"
kind = "reserved"           # core; no templates (0008 §8)

[[namespace]]
id = 12
canonical = "Help"
kind = "reserved"           # core; help content goes in Project (0008 §2)

[[namespace]]
id = 14
canonical = "Category"
kind = "reserved"           # core; no categories (0008 §8)

