# Default namespaces.  ADR 0008 §2 (as amended 2026-09-27), 0009 §11, 0017 §5, 0019 §2–3, 0029 §2,
# 0038 §4 and §8 (main and Category implemented), 0039 §1 (File, File talk and Media implemented),
# 0041 §4, 0042 §3 and 0043 §2 (Template and Module, conditionally), 0045 §2 (Table), 0048 §7 (Notation), 0049 §2 (Board and Board talk; Thread talk forwards) (kinds say only whether a namespace holds pages; pages namespaces name content models).
#
# kind        "pages" | "reserved" | "virtual" | "resolver" (0041 §4). Only "pages" namespaces hold pages.
# forwards_to For "virtual": every title resolves, as a permanent redirect, to the same title in the
#             namespace with this number. A talk namespace whose subject is its own talk page (0049 §2)
# content_models  For "pages": the allowed content models, IDs from content-models.toml, all of one source
# default_model   For "pages": the model a new page takes (0008 §5); reported by meta=siteinfo as
#                 `defaultcontentmodel` when it is not wikitext (0041 §8)
# uploads     true where pages may carry upload records (File, 0039 §2; 0041 §4)
# normalizer  "first-letter" | "file-name" | "entity-id" | a keyed type's or resolver's name (0008 §3)
# case        What meta=siteinfo reports: "first-letter" | "case-sensitive"
# talk        The paired talk namespace, whose pages are composites of attached threads (0008 §2, 0019 §2)
# enabled_by  A tenant `site` setting that turns the namespace on (0042 §3, 0043 §2). While the setting is
#             off, a core number is treated as "reserved" and a Scribunto number is not listed; pages that
#             already exist stay readable and writes are refused with ts-namespace-disabled.
# default_model_rules  Title-suffix overrides of default_model, applied in order (0043 §2)
#
# Numbering policy (0008 §2, amended 2026-09-27):
#   - Every number MediaWiki core or any Wikibase extension uses is RESERVED: listed here with
#     kind "reserved", never given another meaning, and not implemented unless an ADR says so.
#     Its odd-numbered talk namespace is not enabled either. Implemented so far by ADR: the main
#     namespace (0) and Category (14), both by 0038; File (6), File talk (7) and Media (−2) by 0039.
#     Conditionally, by tenant setting: Template (10) and Template talk (11) by 0042; Module (828)
#     and Module talk (829), Scribunto's numbers, registered and implemented by 0043.
#   - Talk namespaces (odd numbers) exist for implemented subject namespaces only.
#   - 210–219 are Triplespace-specific namespaces; 220–229 are resolver prefixes (0029).
#     Registered on mediawiki.org's Extension default namespaces page; as of 2026-09-27 the page
#     lists nothing between 204 and 240.
#   - Second blocks (0008 §2, amended 2026-10-01): 310–319 for Triplespace-specific namespaces and
#     320–329 for resolver prefixes. A first block is used up before its second. As of 2026-10-01
#     the mediawiki.org page lists nothing in 310–329.
#   - The local name of Project is the site name (0008 §7) and is set per instance.

version = 1

# --- MediaWiki core ---------------------------------------------------------------------------
[[namespace]]
id = -2
canonical = "Media"
kind = "virtual"            # resolves to a file's current bytes, local or foreign (0039 §1)

[[namespace]]
id = -1
canonical = "Special"
kind = "virtual"

[[namespace]]
id = 0
canonical = ""
kind = "pages"           # articles (0038 §8)
normalizer = "first-letter"
case = "first-letter"
subpages = false
content_models = ["wikitext", "markdown", "json", "yaml", "text"]
default_model = "wikitext"
talk = 1

[[namespace]]
id = 1
canonical = "Talk"
kind = "pages"
content_models = ["triplespace-talk"]
default_model = "triplespace-talk"

[[namespace]]
id = 2
