kind = "pages"
content_models = ["triplespace-talk"]
default_model = "triplespace-talk"

[[namespace]]
id = 6
canonical = "File"
kind = "pages"           # description pages with uploads (0039 §1–2)
normalizer = "file-name"
case = "first-letter"
subpages = false
content_models = ["wikitext"]
default_model = "wikitext"
uploads = true
talk = 7

[[namespace]]
id = 7
canonical = "File talk"
kind = "pages"
content_models = ["triplespace-talk"]
default_model = "triplespace-talk"

[[namespace]]
id = 8
canonical = "MediaWiki"
kind = "reserved"           # core; interface messages are not pages here

[[namespace]]
id = 10
