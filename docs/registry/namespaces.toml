canonical = "Category"
kind = "pages"              # category description pages; membership is read from wikitext (0038 §3–4)
normalizer = "first-letter"
case = "first-letter"
subpages = false
content_models = ["wikitext"]
default_model = "wikitext"
talk = 15

[[namespace]]
id = 15
canonical = "Category talk"
kind = "pages"
content_models = ["triplespace-talk"]
default_model = "triplespace-talk"

