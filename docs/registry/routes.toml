# Every route under rest.php/triplespace/v0 (chapter 18 §3.2): the one index of the routes the ADRs
# name, built or not. Edit this file, then `python3 architecture/catalogues.py --write` from docs/
# regenerates the table in 18 §3.2. The generator checks it against the OpenAPI contract
# (api/triplespace-v0.openapi.json): every operation there must be a route here, and the table's
# Built column is derived from the contract.
# 
# routes   the route(s) the row covers, as `METHOD /path` or a bare /path, the ADR's own spelling
# purpose  what it does, with citations
# sources  the ADR sections that define it

