[[route]]
routes = ["POST /auth/{issuer}/start"]
purpose = "The site's door to a login (`purpose=login`, with the session's `logintoken`), to creating one (`purpose=create`) or to adding a sign-in method (`purpose=link`, with its `csrftoken`); `returnto` honoured only on the request's own origin. Creates the flow and answers `303` to the provider ([07](07-actors-and-accounts.md) §2.7). An external issuer's is served at the auth base; on a tenant, the issuer is the built-in `login`, and the `303` goes to the auth host's `/auth/authorize` ([07](07-actors-and-accounts.md) §2.8)"
sources = "[0012](../decisions/0012-api-requirements.md) §5; [0088](../decisions/0088-external-identity-providers.md) §5"

[[route]]
routes = ["GET /auth/authorize"]
purpose = "At the auth base: a tenant's request for a login, with the tenant's issuer code, `state`, the PKCE challenge and the purpose. Answers `303` to the tenant's `/auth/login/callback` with a login code when the auth host's session holds a login the tenant admits, and otherwise to `Special:UserLogin`, keeping the request for ten minutes; the callback URL comes from the tenant's registered base"
sources = "[0089](../decisions/0089-the-auth-host-and-instance-logins.md) §5"

[[route]]
routes = ["GET /auth/{issuer}/callback"]
purpose = "The URL registered with the provider, at the auth base; on a tenant, `/auth/login/callback`, which redeems a login code in process. Exchanges the code; for a flow from the site, applies the outcome to the session it began in and answers `303` to `returnto`, to `Special:CreateAccount` for an identity with no account, or with `tserror`; for one from the Action API, answers `303` to its return URL with `state`"
sources = "[0012](../decisions/0012-api-requirements.md) §5; [0088](../decisions/0088-external-identity-providers.md) §5"

[[route]]
routes = ["GET /auth/pending"]
purpose = "At first login: the issuer's name and the provider's username for the session's pending identity, at the auth base, or for a tenant's pending login, the login name and the username of the identity that authenticated it, so the page can offer it as a suggestion. Only that session can read it. The account is created by `action=createaccount` with `createpreservestate`"
sources = "[0012](../decisions/0012-api-requirements.md) §5; [0088](../decisions/0088-external-identity-providers.md) §5"

