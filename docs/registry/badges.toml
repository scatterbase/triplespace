# Badges (0114 §3; 06 §6.3).
#
# Every badge is an item, which gives it its name and tooltip; an entry here says only what the badge
# marks and where it comes from (`source`), and how it is drawn (`icon`, a Codex icon name; `order`,
# lowest first where several stand together).
#
#   source = "stored"  a sitelink badge, as in Wikibase: the items a sitelink's `badges` may name
#   source = "class"   an entity that is an instance of `class` (instance-of, then subclass-of)
#   source = "rank"    a statement of rank `rank`
#
# Items are in stored form (WDQ… for Wikidata). A tenant adds its own in `badges.local`.

