meaning = "Whether the RDF delta consumer runs for this tenant, writing `view.rdf_delta` from composition events; off, no delta is computed and the update stream is unavailable ([02](02-graphs-rdf-and-query.md))"
source = "[0083](../decisions/0083-write-path-in-three-tiers.md) §3"

[[setting]]
key = "updates.retention"
scope = "tenant"
bound = "tenant"
group = "exchange"
type = "duration"
default = "P30D"
default_text = "30 days"
meaning = "Window of `view.rdf_delta` rows"
source = "[0032](../decisions/0032-sparql-update-stream.md) §3"

[[setting]]
key = "upstream.retire_adopted"
scope = "tenant"
bound = "tenant"
group = "entities"
type = "boolean"
values = "`true`, `false`"
default = true
default_text = "`true`"
meaning = "Retire a local assertion when upstream adopts it"
source = "[0002](../decisions/0002-source-graphs-and-mass-ingest.md) §7; [0067](../decisions/0067-proposals.md) §5"

[[setting]]
key = "wikitext.expansion"
scope = "tenant"
bound = "ceiling"
ceiling = "wikitext.ceiling"
group = "pages"
type = "boolean"
values = "`off`, `on`"
default = false
default_text = "`off`"
reported = true
meaning = "Expand templates and parser functions; enables Template and Template talk"
source = "[0042](../decisions/0042-template-expansion-and-parsoid.md) §2"

[[setting]]
key = "wikitext.lua"
scope = "tenant"
bound = "ceiling"
ceiling = "wikitext.ceiling"
group = "pages"
type = "boolean"
values = "`off`, `on`"
default = false
default_text = "`off`"
reported = true
meaning = "Lua modules. Requires `wikitext.expansion = on`; capped by `wikitext.ceiling`"
source = "[0042](../decisions/0042-template-expansion-and-parsoid.md) §2; [0043](../decisions/0043-lua-modules.md) §1"

[[setting]]
key = "wikitext.renderer"
scope = "tenant"
bound = "tenant"
group = "pages"
type = "choice"
choices = ["builtin", "parsoid"]
default = "builtin"
reported = true
meaning = "Which stage-2 renderer serves HTML. `parsoid` requires expansion on and a Parsoid service on the instance"
source = "[0042](../decisions/0042-template-expansion-and-parsoid.md) §2"

[[setting]]
key = "wikitext.site_styles"
scope = "tenant"
bound = "tenant"
group = "pages"
type = "page"
values = "a Project-namespace title"
no_default = true
default_text = "— (`Project:Site styles.css` by convention)"
meaning = "The tenant's `sanitized-css` site styles page"
source = "[0055](../decisions/0055-templatestyles-templatedata-and-page-properties.md) §4"

[[setting]]
key = "files.reclaim_after"
scope = "instance"
bound = "instance"
tenant_may_narrow = true
group = "files"
type = "duration"
values = "duration, or `never`"
default = "P365D"
default_text = "365 days"
meaning = "After how long unreadable to `universe` a file version is erased; a tenant may set a shorter period, never a longer one"
source = "[0039](../decisions/0039-files-and-media.md) §9"

[[setting]]
key = "files.separation"
scope = "instance"
bound = "instance"
group = "files"
type = "choice"
choices = ["tenant", "instance"]
default = "tenant"
right = "owner"
meaning = "Whether each tenant's bytes are stored apart or identical bytes once; changing it is `triplespace-cli files rescope`, needing `owner`"
source = "[0039](../decisions/0039-files-and-media.md) §4"

[[setting]]
key = "files.types"
scope = "instance"
bound = "instance"
tenant_may_narrow = true
group = "files"
type = "string-list"
values = "file types"
no_default = true
default_text = "the registry's `default = true` entries"
meaning = "The types the instance allows; a tenant `site` setting may narrow the list but not widen it"
source = "[0039](../decisions/0039-files-and-media.md) §5"

[[setting]]
key = "instance.owner_of_record"
scope = "instance"
bound = "instance"
group = "instance"
type = "actor"
values = "—"
no_default = true
default_text = "unset"
meaning = "The instance's owner of record, shown on `Special:Version` where set"
source = "[0077](../decisions/0077-special-version.md) §1"

[[setting]]
key = "instance.source_url"
scope = "instance"
bound = "instance"
group = "instance"
type = "url"
values = "A URL for the corresponding source of this build"
no_default = true
default_text = "Unset: `{developer.source}/tree/{commit}` for an unmodified build"
meaning = "Where a modified build's source is published; a modified build without it shows \"modified build; source location not configured\", and `instance check` warns"
source = "[0077](../decisions/0077-special-version.md) §3, §13"

[[setting]]
key = "query.embedded_max_triples"
scope = "instance"
bound = "instance"
group = "query"
type = "integer"
default = 1000000000
default_text = "10^9"
meaning = "The triple count above which `query.backend = embedded` is refused: the embedded backend is the small profile's, and the Wikidata profile requires `remote` ([02](02-graphs-rdf-and-query.md))"
source = "[0059](../decisions/0059-query-service.md) §2"

[[setting]]
key = "query.max_concurrent"
scope = "instance"
bound = "instance"
group = "query"
type = "integer"
default = 8
meaning = "Concurrent queries across the instance, beyond which a query waits up to its own timeout; a tenant cannot set it"
source = "[0059](../decisions/0059-query-service.md) §6"

[[setting]]
key = "storage.dedup_scope"
scope = "instance"
bound = "instance"
group = "instance"
type = "choice"
choices = ["tenant", "instance"]
values = "per tenant, `\"instance\"`"
default = "tenant"
default_text = "each tenant is its own domain"
meaning = "Whether fragments are deduplicated per tenant or once for the instance"
source = "[0058](../decisions/0058-packed-record-storage.md) §8"

[[setting]]
key = "talk.archive_window"
scope = "instance"
bound = "instance"
group = "discussion"
type = "duration"
default = "PT10M"
default_text = "10 minutes"
meaning = "Window within which a removed thread found on an archive subpage counts as archived"
source = "[0069](../decisions/0069-synchronized-talk-pages.md) §2, §11"

[[setting]]
key = "thread.max_depth"
scope = "instance"
bound = "instance"
group = "discussion"
type = "integer"
no_default = true
default_text = "—"
meaning = "Depth to which a thread page indents its posts"
source = "[0019](../decisions/0019-discussions.md) §8"

[[setting]]
key = "version.services"
scope = "instance"
bound = "instance"
group = "instance"
type = "choice"
choices = ["full", "names", "off"]
default = "full"
meaning = "How much `Special:Version` discloses of the instance's services: everything, as MediaWiki shows its database version to everyone; names, roles and states without versions; or the build row only. Holders of `ts-config` at the farm base always see `full`"
source = "[0077](../decisions/0077-special-version.md) §4, §13"

[[setting]]
key = "witness.enabled"
scope = "instance"
bound = "instance"
group = "instance"
type = "json"
values = "off, on, with the witnessed origins and their keys"
no_default = true
default_text = "off"
meaning = "Whether `triplespace-server` serves the C2SP tlog-witness API at the farm base for the listed origins ([01](01-log-and-records.md) §4.3)"
source = "[0081](../decisions/0081-recovery-keys-and-continuations.md) §6"
