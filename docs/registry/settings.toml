# Settings.  ADR 0085 §1.
#
# Every `site` setting: a tenant's (architecture chapter 23 §3.2) and the instance's (§3.3). This file is the
# catalogue of record; the two tables in chapter 23 are generated from it by `docs/architecture/settings.py`
# (`--write` rewrites them, no flag checks them, and CI runs the check). Tenancy switches are registered in
# tenancy.toml, preference keys in preferences.toml, fields of other config records and deployment
# configuration in chapter 23 §3.5–3.6; none of those is a `site` setting.
#
# Embedded by triplespace-accounts, which validates every `site` record against it (type, choices, bound,
# lock, right) for the API, the settings pages and triplespace-cli alike, and resolves a setting's value
# (0085 §2). An instance may register settings of its own as config records beside the copied ones, as it
# may preference keys (0027 A7).
#
# key           The setting name. Never reused for another meaning; a retired setting keeps its entry
#               with `retired = true`.
# scope         "tenant": a record in a tenant's `config`. "instance": a record in the instance `config`,
#               written at the farm base.
# bound         Who has the last word (23 §3.1): "tenant"; "ceiling", the tenant's value up to the
#               instance's ceiling, a tenancy switch named `ceiling` or, absent that, a switch of the
#               setting's own name; "instance".
# tenant_may_narrow
#               For an instance setting: a tenant `site` record of the same name may narrow the value
#               but not widen it.
# group         The tab of Special:WikiSettings or Special:InstanceSettings ([[group]] below).
# type          boolean | integer | duration (ISO 8601) | size | text | string | url | language |
#               language-list | choice | string-list | integer-list | map | json, or a reference kind:
#               page | page-list | file | group | actor | repository | repository-list | property-list |
#               namespace-list | site | licence | collation | pattern | schedule | palette | typeset; or site-asset, a pinned
#               version of a local file the setting uses for a site function, public while named (0085 §8).
# media         For type "site-asset": the media types it accepts.
# choices       For type "choice": the permitted values.
# values        The catalogue's "Values" text, where it says more than the type does.
# default       The registry default, as a value of the type.
# no_default    true when there is none: the default is computed, or the setting is unset by default;
#               `default_text` says which. Every entry has `default` or `no_default`.
# default_text  The catalogue's "Default" text, where it says more than `default` does.
# by_rule       true: the defining ADR names the setting without saying which `config` holds it, and
#               23 §3.1's rule makes it a tenant `site` setting.
# scope_note    The catalogue's "Scope" text, where it is neither `site` nor the by-rule form.
# right         The permission needed to write it, or `owner` where only members of `owner` may. Default
#               `ts-config` (at the farm base for instance settings, an instance right).
# reported      true: `meta=siteinfo` reports it (23 §6), so a client never needs GET /settings for it.
# meaning, source
#               The catalogue's text, in Markdown with links relative to docs/architecture/.
#
# Labels are interface messages, never stored here: `ts-setting-{key}` and `ts-setting-{key}-help`, with the
# dots of the key turned into hyphens; a group's label is `ts-settings-group-{id}`.

version = 1

