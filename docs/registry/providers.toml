# Provider registry.  ADR 0000 §3, 0002 §4, 0015 §2 and §5, 0022 §2, 0044 §2.
#
# code         Two-letter code that prefixes entity IDs minted by the provider (WDQ42).
# slug         Lower-case name used in graph names (mirror/{slug}) and in the API.
# number       Provider number for the revision-ID range: revid = number << 40 | n (0015 §2).
#              0 is the instance itself and is never assigned.
# issuer       The issuer (issuers.toml) that the provider's revisions attribute actors to,
#              or the provider itself for providers without individual actors (0007 §6).
# revision_ids true if the provider publishes revision IDs; then n is the upstream revision ID,
#              otherwise n is the mirror record's offset.
# adapter      The crate that implements the provider's adapter (0002 §8.4).
# trust        For a provider that publishes a tlog checkpoint (a Triplespace instance, Scatterbase):
#              "verified" (default for scatter-adapter-triplespace) checks every mirrored batch against
#              the provider's checkpoint and key chain; "stream" mirrors without proofs (0022 §2).
# keys         The provider's key-chain URL, {base}/.well-known/tlog/keys, required when trust = "verified".
# chip_color, chip_background
#              The provider chip's text and background colours in the site, #RRGGBB, both or neither
#              (0010 §2). The text must meet 4.5:1 on the background; the site checks it and shows a
#              neutral chip where it does not. Each provider's pair differs from the others in hue, and
#              from the Local and Best value chips the site draws itself.
#
# Each [[provider.type]] gives one entity type the provider mints:
#   code             One-letter type code; the entity ID prefix is provider.code + type.code.
#   entity_type      The Wikibase entity type of the mirrored entity.
#   upstream_prefix  What the provider's own IDs start with, for rewriting (Q123 <-> WDQ123).
#   iri              Canonical concept IRI template; {upstream_id} is the provider's own ID.
#   namespace        The Triplespace namespace (namespaces.toml) whose pages host the type.
#
# Codes and numbers are never reused (README).

version = 1

# Reserved codes (0044 §2). A type letter written three times, QQQ5, is the tenant-relative form of
# a local ID, so a doubled letter is never a provider code. All twenty-six are reserved, so a type
# letter added later already has its form. scatter-providers rejects a provider that takes one.
reserved_codes = ["AA", "BB", "CC", "DD", "EE", "FF", "GG", "HH", "II", "JJ", "KK", "LL", "MM", "NN", "OO", "PP", "QQ", "RR", "SS", "TT", "UU", "VV", "WW", "XX", "YY", "ZZ"]

# id_grammar   How the part after the three-letter prefix is formed (0017 §2): "digits" (default,
#              canonical as given), "uuid" (RFC 4122 text form, canonical lowercase), "gdelt-record"
#              (14 digits, `-`, optional `T`, digits) or "token" (uppercase letters, digits and
#              underscores, starting with a letter; 0037 §2). May be set on a provider or, overriding it,
#              on a single type.
# pages        true for a provider whose pages a page repository serves (0052 §1). Such a provider may
#              mint no entities: it then has no code and no [[provider.type]], and its number ranges the
#              page IDs and revision IDs of its pages (0052 §6). `rest` is its MediaWiki REST base (0053 §1).
#              scatter-providers does not accept a codeless entry yet, so English Wikipedia's entry
#              (slug enwiki, number 9, issuer enwiki) is a pending allocation (README) rather than a row here.
# key_mapped   On a type: upstream entities of this type are written under a keyed type's keys
#              (0009 §9) instead of prefixed IDs. The type code stays reserved.

# ---------------------------------------------------------------------------
# Wikidata
# ---------------------------------------------------------------------------
[[provider]]
code = "WD"
slug = "wikidata"
name = "Wikidata"
chip_color = "#1F5139"
chip_background = "#E3EEE8"
number = 1
issuer = "wikidatawiki"
revision_ids = true
article_path = "https://www.wikidata.org/wiki/"
api = "https://www.wikidata.org/w/api.php"
entity_data = "https://www.wikidata.org/wiki/Special:EntityData/"
adapter = "scatter-adapter-wikidata"
agent_iri = "http://www.wikidata.org/entity/Q2013"    # the provider as a prov:Organization (0007 §6)

  [[provider.type]]
  code = "Q"
  entity_type = "item"
  upstream_prefix = "Q"
  iri = "http://www.wikidata.org/entity/{upstream_id}"
  namespace = "Item"

  [[provider.type]]
  code = "P"
  entity_type = "property"
  upstream_prefix = "P"
  iri = "http://www.wikidata.org/entity/{upstream_id}"
  namespace = "Property"

  [[provider.type]]
  code = "L"
  entity_type = "lexeme"
  upstream_prefix = "L"
  iri = "http://www.wikidata.org/entity/{upstream_id}"
  namespace = "Lexeme"             # reserved as 146 in namespaces.toml, not implemented; mirroring lexemes requires implementing it

  [[provider.type]]
  code = "M"
  entity_type = "mediainfo"
  upstream_prefix = "M"
  iri = "https://commons.wikimedia.org/entity/{upstream_id}"
  namespace = "File"               # a MediaInfo entity is the `mediainfo` slot of a File page, not a namespace of its own (0041 §6–7); mirroring it onto foreign files is open (0039)

