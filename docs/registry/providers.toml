# ---------------------------------------------------------------------------
# OpenAlex
# ---------------------------------------------------------------------------
[[provider]]
code = "OA"
slug = "openalex"
name = "OpenAlex"
number = 3
issuer = "openalex"
revision_ids = false             # no revision history; n is the mirror record's offset (0015 §2)
api = "https://api.openalex.org/"
adapter = "scatter-adapter-openalex"
# agent_iri: OpenAlex's Wikidata item, as a prov:Organization (0007 §6) — to be set when confirmed

  [[provider.type]]
  code = "W"
  entity_type = "item"
  upstream_prefix = "W"
  iri = "https://openalex.org/{upstream_id}"
  namespace = "Item"
  label = "Work"

  [[provider.type]]
  code = "A"
  entity_type = "item"
  upstream_prefix = "A"
  iri = "https://openalex.org/{upstream_id}"
  namespace = "Item"
  label = "Author"

  [[provider.type]]
  code = "S"
  entity_type = "item"
  upstream_prefix = "S"
  iri = "https://openalex.org/{upstream_id}"
  namespace = "Item"
  label = "Source"

  [[provider.type]]
  code = "I"
  entity_type = "item"
  upstream_prefix = "I"
  iri = "https://openalex.org/{upstream_id}"
  namespace = "Item"
  label = "Institution"

  [[provider.type]]
  code = "T"
  entity_type = "item"
  upstream_prefix = "T"
  iri = "https://openalex.org/{upstream_id}"
  namespace = "Item"
  label = "Topic"

  # Keywords are mapped by key onto the `keyword` keyed type (0017 §5), as 0009 §9 maps
  # internetdomains.wiki items onto Domains. No OAK entity is ever minted; the code stays reserved.
  [[provider.type]]
  code = "K"
  entity_type = "keyword"
  key_mapped = true
  upstream_prefix = "keywords/"
  iri = "https://openalex.org/keywords/{upstream_id}"
  label = "Keyword"

  [[provider.type]]
  code = "P"
  entity_type = "item"
  upstream_prefix = "P"
  iri = "https://openalex.org/{upstream_id}"
  namespace = "Item"
  label = "Publisher"

  [[provider.type]]
  code = "F"
  entity_type = "item"
  upstream_prefix = "F"
  iri = "https://openalex.org/{upstream_id}"
  namespace = "Item"
  label = "Funder"

  [[provider.type]]
  code = "G"
  entity_type = "item"
  upstream_prefix = "G"
  iri = "https://openalex.org/{upstream_id}"
  namespace = "Item"
  label = "Award"

