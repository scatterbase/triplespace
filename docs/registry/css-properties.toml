# CSS properties and at-rules the sanitizer allows.  ADR 0055 §2.
#
# Embedded by scatter-css, which validates every `sanitized-css` page at save and sanitizes mirrored
# and site stylesheets at render (0055 §1–4). The policy is TemplateStyles': the rules of Wikimedia's
# css-sanitizer, so that Wikipedia's template stylesheets are accepted as they are written.
#
# at_rules      The at-rules allowed, each with whether its block is sanitized as rules (`@media`,
#               `@supports`, `@keyframes`) or as declarations (`@page`, `@font-feature-values`).
#               Every other at-rule is refused: @import, @charset, @namespace, @font-face above all.
# forbidden     Values and properties refused wherever they appear.
# [property]    Each allowed property, with the CSS module it comes from, as css-sanitizer groups them.
#               A property not listed is refused. Vendor-prefixed properties are never allowed.
# url_policy    Where `url()` may point: a local or inherited file, written as the media base URL
#               (0039 §11), or a `data:` image under `data_max_bytes`. Nothing else.
#
# This file is the hand-written seed and the shape. The full list is generated from css-sanitizer's
# published property set by `scripts/gen-css-properties.py` (to be written), as `sites.toml` is from
# the site matrix; which modules are included is hand-edited (0055 Q3). Names are never removed: a
# property that stops being allowed changes `allowed` to false.

version = 1

[at_rules]
media               = { block = "rules" }
supports            = { block = "rules" }
keyframes           = { block = "rules", prefix = ".mw-parser-output" }   # keyframe names are scoped too
page                = { block = "declarations" }
font-feature-values = { block = "declarations" }

[forbidden]
functions  = ["expression"]
properties = ["behavior", "-moz-binding"]
values     = [ { property = "position", value = "fixed" } ]
selectors  = ["html", "body", ":root"]        # rewritten to match nothing; every selector is prefixed with .mw-parser-output

[url_policy]
files          = true                           # a file title resolved through the file lookup (0039 §11)
data_images    = true
data_max_bytes = 32768
external       = false

# --- Properties ----------------------------------------------------------------------------------
# module  "css21" | "backgrounds" | "borders" | "box" | "align" | "flexbox" | "grid" | "fonts" | "text" |
#         "text-decor" | "color" | "transforms" | "transitions" | "animations" | "multicol" | "writing" |
#         "ui" | "images" | "lists" | "tables" | "sizing" | "position" | "display" | "overflow" | "masking" |
#         "logical" | "ruby" | "break"
[property]
# CSS 2.1 and the box model
margin              = { module = "css21" }
margin-top          = { module = "css21" }
margin-right        = { module = "css21" }
margin-bottom       = { module = "css21" }
margin-left         = { module = "css21" }
padding             = { module = "css21" }
padding-top         = { module = "css21" }
padding-right       = { module = "css21" }
padding-bottom      = { module = "css21" }
padding-left        = { module = "css21" }
width               = { module = "sizing" }
height              = { module = "sizing" }
min-width           = { module = "sizing" }
min-height          = { module = "sizing" }
max-width           = { module = "sizing" }
max-height          = { module = "sizing" }
box-sizing          = { module = "sizing" }
display             = { module = "display" }
visibility          = { module = "display" }
float               = { module = "css21" }
clear               = { module = "css21" }
position            = { module = "position" }     # fixed is forbidden (above)
top                 = { module = "position" }
right               = { module = "position" }
bottom              = { module = "position" }
left                = { module = "position" }
z-index             = { module = "position" }
overflow            = { module = "overflow" }
overflow-x          = { module = "overflow" }
overflow-y          = { module = "overflow" }
text-overflow       = { module = "overflow" }
vertical-align      = { module = "css21" }
line-height         = { module = "css21" }
cursor              = { module = "ui" }
outline             = { module = "ui" }
outline-width       = { module = "ui" }
outline-style       = { module = "ui" }
outline-color       = { module = "ui" }
outline-offset      = { module = "ui" }
content             = { module = "css21" }        # strings, counters and attr() only; url() follows url_policy
quotes              = { module = "css21" }
counter-reset       = { module = "lists" }
counter-increment   = { module = "lists" }
list-style          = { module = "lists" }
list-style-type     = { module = "lists" }
list-style-position = { module = "lists" }
list-style-image    = { module = "lists" }
table-layout        = { module = "tables" }
border-collapse     = { module = "tables" }
border-spacing      = { module = "tables" }
caption-side        = { module = "tables" }
empty-cells         = { module = "tables" }
