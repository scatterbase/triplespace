# Special pages.  ADR 0047.
#
# Every special page name the instance knows: the pages it serves, the ones it defers or declines,
# and the names it reserves. Embedded by triplespace-titles, which resolves `Special:` titles,
# aliases and section aliases, and applies the scope rules (0047 §1–3).
#
# name             The canonical name. Where MediaWiki or an extension has the page, MediaWiki's first
#                  English alias (MessagesEn.php / the extension's alias file), e.g. RecentChanges.
# mediawiki_name   MediaWiki's internal name where it differs: `realname` in siprop=specialpagealiases,
#                  and the `qppage` value of list=querypage.
# origin           "mediawiki" | an extension's name | "triplespace"
# status           "served"    the instance serves it (a decision, not a claim about the code)
#                  "deferred"  undecided; `until` names what it waits on
#                  "declined"  decided against; `reason` says why. Answered as "no such special page".
#                  "reserved"  belongs to an entity type reserved but not implemented; never reused
# scope            "tenant" | "farm" | "both" (0047 §3). Default "tenant".
# group            The Special:SpecialPages heading: MediaWiki's group keys (maintenance, pages, login,
#                  users, changes, media, wiki, redirects, highuse, pagetools, other) plus wikibaserepo,
#                  wikibaseclient, identity and instance. "unlisted" pages are never listed.
# listed           false for pages served but not listed (redirecting pages, per-object pages).
# restricted       The permission without which the page is not listed and refuses to act.
# requires         A `site` setting that must be on (0042 §2) for the page to be listed and served.
# aliases          Other names that reach the page; a GET is redirected (301) to `name` (0047 §2).
#                  Matching is case-insensitive.
# section_aliases  MediaWiki pages whose function is part of this page: name -> "#anchor" or "/subpage".
#                  Each is reported by siprop=specialpagealiases as its own realname.
# report           For reports (0047 §4): backing ("index" | "projection"), what it reads, and its default
#                  graph scope. The instance's operators may switch a projection report to batch, for the
#                  whole instance or for one tenant, in the instance-scope `reports` config (0047 §4.3).
#                  Reports read the tenant's own partitions only unless widened there (0047 §4.2).
# adr              Where the page is specified.
#
# Rules: names are never removed (a page that stops being served changes status); a name is never
# given a second meaning; every `Special:` name an ADR uses is a name, alias or section alias here
# (check_adrs.py, check 5). Localized aliases are i18n messages, not entries here (0047 §2).
#
# Names, internal names, groups and English aliases are copied from MediaWiki REL1_43
# (SpecialPageFactory::CORE_LIST and its conditional pages; MessagesEn.php) and Wikibase REL1_43
# (extension-repo.json, extension-client.json and their alias files). Statuses are hand-edited.

version = 1

