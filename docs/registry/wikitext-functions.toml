# Variables, parser functions, extension tags and behaviour switches.  ADR 0042 §5; 0043 §7; 0062 §2–3 (blocks).
#
# What the expander (scatter-wikitext-expand) recognises, and what meta=siteinfo reports as
# `variables`, `magicwords`, `functionhooks`, `extensiontags` and `doubleunderscores` (0042 §5, §8.1).
#
# Each table maps the name as written in wikitext to an entry:
#   origin     "mediawiki" | an extension's name ("ParserFunctions", "Scribunto", "WikibaseClient", "Cite", ...)
#   status     "implemented"  expanded or rendered as MediaWiki does
#              "chip"         recognised; renders as a visible chip showing the source (0008 §8)
#              "ignored"      recognised and without effect: a switch that does nothing here, or a tag
#                             that renders nothing
#   synonyms   other spellings MediaWiki accepts for the same word
#   expensive  counts against the expensive-function limit (0042 §16)
#   volatile   the output changes with time or site statistics; recorded in the render manifest (0042 §10)
#   requires   a `site` setting that must be on, beyond wikitext.expansion
#   scoped     a workspace block: output depends on a scope, table, sprint or board; a scoped-block manifest entry (0062 §3)
#
# Variables in the page-name, namespace and revision families also take an argument as functions
# ({{PAGENAME:Some title}}), as in MediaWiki; that is implied and not listed twice.
#
# This file is the hand-written seed and the shape the generator produces. The full core and extension
# set, with synonyms and case sensitivity, is generated from the reference install's meta=siteinfo
# (siprop=magicwords|functionhooks|extensiontags|variables|doubleunderscores) once ParserFunctions and
# Scribunto are installed there (0042 §18), by `scripts/gen-wikitext-functions.py` (to be written).
# Statuses are hand-edited. Names are never removed: an entry that stops being supported changes status.

version = 1
generated_from = "reference install meta=siteinfo (pending)"
generated_at = "pending"

