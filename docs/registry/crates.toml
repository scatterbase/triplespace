[[crate]]
names = ["scatter-log"]
layer = "substrate"
summary = "An append-only log split into partitions and generic over the record type"
depends = ["oxrdf"]
contents = """
An append-only log split into partitions and generic over the record type; the `pages/{repo}` graph ([0053](../decisions/0053-mirrored-pages.md) §5) and the optional `text` part of `scatter:v0/upstream-revision` ([0054](../decisions/0054-forking-a-mirrored-page.md) §3). The `LogStore` trait (`append`, `read`, `scan`, `erase_parts`, `compact`, `head`), with `Send` futures and an associated unit-of-work type (§1.2 rule 2), and its file backend, `segments`, whose synchronous I/O a runtime caller drives through `spawn_blocking` ([0013](../decisions/0013-postgres-storage.md) §1, §10). The record header and body formats, hash tags, segment layout and Merkle tree ([0006](../decisions/0006-log-integrity-and-erasure.md) §2–5). **The graph and partition registry** (§4.1, §4.2), formerly `scatter-graphs`. Header fields 7–9, the provider-ranged revision ID and the body of erasable parts ([0015](../decisions/0015-record-format-and-partition-registry.md) §1–2). The `config` payload type with kinds `key` and `graph`, the `membership` and `block` types ([0015](../decisions/0015-record-format-and-partition-registry.md) §3, [0016](../decisions/0016-permissions-and-access-control.md) §3), and the `acl` payload type, appended to `config` for graph targets and to `log` for moderation ([0023](../decisions/0023-moderation.md) §3). `scope` on `group` ([0028](../decisions/0028-tenancy-policy.md) §14). Durable offsets, tombstones, bootstrap segment writing, and replay from any offset. Embeds `docs/registry/graphs.toml` as the default registry ([0015](../decisions/0015-record-format-and-partition-registry.md) §5); the instance `log` partition and `files/{repo}` mirror partitions in the graph registry ([0039](../decisions/0039-files-and-media.md) §10–11); the instance attestation, domain tag `0x06` and the refusal of submitted instance attestations ([0040](../decisions/0040-instance-prerogatives.md) §3); the stored-form codec of packed storage: path patterns over CBOR, packing a body into fragment references, splicing it back and checking the commitment on rebuild, embedding `docs/registry/fragments.toml`; it does not compress ([0058](../decisions/0058-packed-record-storage.md) §1, §3); the `derived/{source}` graph ([0071](../decisions/0071-derived-statements-from-mirrored-pages.md) §1); the `recovery-key`, `continuation` and `continuation-cancel` config kinds ([0081](../decisions/0081-recovery-keys-and-continuations.md) §10)
"""

