# The crate map: every crate of the workspace, its layer, what it holds and what it may depend on
# (chapter 22 §2.1; 0005 §2 and the Crates trailer of every ADR since). Edit this file, then run
# `python3 architecture/crates.py --write` from docs/ to regenerate the table in 22 §2.1 and
# architecture/CRATES.md. `cargo xtask deps` checks the workspace against it: layers point only
# downward, a crate depends only on what its row names, `pure` crates do no I/O, and `wasm` crates
# build for wasm32-unknown-unknown (22 §1.2 rules 1, 2 and 7).
#
# names        the crate(s) the row covers (a few rows cover two or three that share a description)
# layer        substrate | wikibase | ingest | triplespace, in build order
# summary      one line, shown in the chapter table
# depends      the workspace and external crates the row allows, by name
# depends_any  "lower": any crate in the same or a lower layer; "core": any substrate or wikibase crate
# depends_note prose the Depends-on cell carried beside the names
# pure         22 §1.2 rule 2: no I/O, no async runtime
# wasm         22 §1.2 rule 7: builds for wasm32-unknown-unknown
# contents     what the crate holds, in full, with citations (shown in CRATES.md)
#
# [[retired]]  a crate name an ADR used that no longer exists as a crate: `into` names the crate that
#              holds it now, `renamed` marks a rename rather than a merge, `sources` the ADR that did it.
#              References to a retired name in the ADRs read as references to `into`.

