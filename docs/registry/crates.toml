es-and-media.md) §7); `files import`, `files rescope`, `files verify`, `takedown`, `reinstate` and `expunge` ([0039](../decisions/0039-files-and-media.md) §23); `render refresh` and `render rebuild` ([0042](../decisions/0042-template-expansion-and-parsoid.md) §19); `instance create --farm-slug`, `primary offer`, `primary withdraw` and `primary accept` ([0046](../decisions/0046-primary-tenant.md) §9); `triplespace-server` has `server.mode`, `server.trusted_proxies` and forwarder keys, read right to left ([0057](../decisions/0057-web-tier.md) §10), `server.admin_listen`, 421 on an unregistered host and the internal endpoint for Parsoid, and `triplespace-cli` has `instance forwarder create`, `list` and `revoke` ([0057](../decisions/0057-web-tier.md) §10), and `instance check` with `--attest` and `--through`, and `tenancy check` extended to confidential restrictions and group names ([0056](../decisions/0056-security-model.md) §10, §13, §16); `storage measure`, `repack`, `retrain`, `sweep` and `pack` ([0058](../decisions/0058-packed-record-storage.md) §10); `triplespace migrate` applies pending migrations and `triplespace-server` refuses to start over any ([0033](../decisions/0033-backend-stack.md) A20); `triplespace-cli` has `query status`, `query rebuild` and `query run`, and `triplespace-server` the `query.*` settings, the `query` rate class and the `query` block of `siprop=triplespace` ([0059](../decisions/0059-query-service.md) §8); `instance create` writes the default kit templates and kits into the primary tenant ([0062](../decisions/0062-workspaces.md) §10); mounting `/mcp` per tenant ([0075](../decisions/0075-mcp-server.md) §7); the `mirror`, `extraction draft`, `publication` and `dump` commands ([0070](../decisions/0070-shallow-entity-mirroring.md) §9, [0072](../decisions/0072-template-mappings.md) §6, [0074](../decisions/0074-publishing-a-scope-to-an-external-wiki.md) §8, [0076](../decisions/0076-dataset-publication.md) §6); `source add`, `list`, `retire` and `promote`, and `registry check`, in `triplespace-cli` ([0078](../decisions/0078-entity-sources.md) §3, §9–10); `instance create` copies the embedded registry into the instance `config`, `registry sync` appends records for the entries newer than the instance's, and `instance check` warns when the instance is behind ([23](23-configuration-and-registry.md) §4.1); `instance create` derives the farm code, and tenant creation each tenant's issuer code, from the founding record once it is appended ([0079](../decisions/0079-derived-issuer-codes.md) §8); the tlog-witness endpoint under `witness.enabled`, and `recovery-key generate`, `register` and `replace`, `recovery sign`, `tenant import --continue` and `continuation cancel` ([0081](../decisions/0081-recovery-keys-and-continuations.md) §10); `triplespace-cli settings get`, `set` and `unset`, with `--instance`, `--default` and `--lock` ([0085](../decisions/0085-settings-and-preferences.md) §9); `triplespace-cli challenge solve` ([0087](../decisions/0087-account-registration-and-challenges.md) §10); `triplespace-cli oauth-client set`, `list`, `callback` and `remove` ([0088](../decisions/0088-external-identity-providers.md) §3); `triplespace-server` has `server.auth_base`, serves the auth base and refuses a second tenant without one, and `triplespace-cli` has `logins migrate` and sets a password by login ([0089](../decisions/0089-the-auth-host-and-instance-logins.md) §17); `triplespace-cli adopt` adopts a source without Wikibase, registers the source's namespaces as tenant `namespace` records, and renames or archives one whose name is taken with `--namespace` ([0096](../decisions/0096-adopting-any-mediawiki.md) §6); `triplespace-server` embeds the default skin and has `server.skins` and `server.renderer` ([0097](../decisions/0097-versioning-and-skins.md) §8, §16)
"""

