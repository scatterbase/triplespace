[workspace]
resolver = "3"
members = [
    "crates/scatter-vocab",
    "crates/scatter-providers",
    "crates/scatter-normalize",
    "crates/scatter-wikibase-model",
    "crates/scatter-wikibase-changeset",
    "crates/scatter-wikibase-resolve",
    "crates/scatter-ingest",
    "crates/triplespace-api-ingest",
    "crates/scatter-actors",
    "crates/scatter-log",
    "crates/scatter-integrity",
    "crates/scatter-log-postgres",
    "crates/triplespace-db",
    "crates/scatter-projection",
    "crates/triplespace-projections",
    "xtask",
]

# Crates are added here as they are built, in the order of ADR 0005 §7. The dependency
# graph between workspace crates is checked against the table in ADR 0005 §2 by
# `cargo xtask deps` (0005 §3, rule 1).

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/scatterbase/triplespace"
authors = ["Scatter LLC"]

[workspace.dependencies]
# Workspace crates
scatter-vocab = { path = "crates/scatter-vocab" }
scatter-providers = { path = "crates/scatter-providers" }
scatter-normalize = { path = "crates/scatter-normalize" }
scatter-wikibase-model = { path = "crates/scatter-wikibase-model" }
scatter-wikibase-changeset = { path = "crates/scatter-wikibase-changeset" }
scatter-wikibase-resolve = { path = "crates/scatter-wikibase-resolve" }
scatter-ingest = { path = "crates/scatter-ingest" }
triplespace-api-ingest = { path = "crates/triplespace-api-ingest" }
scatter-actors = { path = "crates/scatter-actors" }
scatter-log = { path = "crates/scatter-log" }
scatter-integrity = { path = "crates/scatter-integrity" }
scatter-log-postgres = { path = "crates/scatter-log-postgres" }
triplespace-db = { path = "crates/triplespace-db" }
triplespace-projections = { path = "crates/triplespace-projections" }
scatter-projection = { path = "crates/scatter-projection" }

# RDF terms: the oxrdf family only (0005 §3, rule 5)
oxrdf = "0.3"

# Identifiers, URLs, case and normalization (0033 §9.3); all build for wasm32
idna = "1"
url = "2"
percent-encoding = "2"
unicode-normalization = "0.1"
icu_casemap = "2"
# Only on wasm targets, with the `wasm_js` feature (see .cargo/config.toml)
getrandom = "0.3"

# Ordered maps for JSON objects whose order is data (qualifiers-order, snaks-order)
indexmap = { version = "2", features = ["serde"] }

# Wikibase's own hashes, reproduced for compatibility (0006 §2): SHA-1 for snaks and
# references, MD5 for RDF value nodes. Not used for anything Triplespace secures.
sha1 = "0.10"
md-5 = "0.10"
# Statement keys (0004 §8), signing-key IDs (0015 §1) and, later, the log's SHA-256 (0006 §2)
sha2 = "0.10"
# Canonical CBOR, hand-written to the core-deterministic rules over minicbor's primitives
# (0006 §2; 0033 §6)
minicbor = { version = "2", default-features = false, features = ["std", "half"] }

# Instance and client signatures (0033 §6; 0006 §6; 0024 §4)
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
# C2SP signed notes and checkpoints carry hashes and signatures in base64 (0006 §6)
base64 = "0.22"

# Registry files and configuration (0033 §12)
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"

# Errors (0033 §14)
thiserror = "2"
anyhow = "1"

# Driving async traits from synchronous tests (0005 rule 2: no runtime in the core)
pollster = "1"

# Postgres: the one async substrate crate (0005 rule 2; 0033 §4)
tokio = { version = "1", default-features = false }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1"] }
deadpool-postgres = "0.14"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the ADRs' own naming and prose style.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
