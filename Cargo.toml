[workspace]
resolver = "3"
members = [
    "crates/scatter-vocab",
    "crates/scatter-providers",
    "crates/scatter-normalize",
    "crates/scatter-wikibase-model",
    "xtask",
]

# Crates are added here as they are built, in the order of ADR 0005 §7. The dependency
# graph between workspace crates is checked against the table in ADR 0005 §2 by
# `cargo xtask deps` (0005 §3, rule 1).

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/scatterbase/triplespace"
authors = ["Scatter LLC"]

[workspace.dependencies]
# Workspace crates
scatter-vocab = { path = "crates/scatter-vocab" }
scatter-providers = { path = "crates/scatter-providers" }
scatter-normalize = { path = "crates/scatter-normalize" }
scatter-wikibase-model = { path = "crates/scatter-wikibase-model" }

# RDF terms: the oxrdf family only (0005 §3, rule 5)
oxrdf = "0.3"

# Identifiers, URLs, case and normalization (0033 §9.3); all build for wasm32
idna = "1"
url = "2"
percent-encoding = "2"
unicode-normalization = "0.1"
icu_casemap = "2"
# Only on wasm targets, with the `wasm_js` feature (see .cargo/config.toml)
getrandom = "0.3"

# Ordered maps for JSON objects whose order is data (qualifiers-order, snaks-order)
indexmap = { version = "2", features = ["serde"] }

# Wikibase's own hashes, reproduced for compatibility (0006 §2): SHA-1 for snaks and
# references, MD5 for RDF value nodes. Not used for anything Triplespace secures.
sha1 = "0.10"
md-5 = "0.10"

# Registry files and configuration (0033 §12)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

# Errors (0033 §14)
thiserror = "2"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that fight the ADRs' own naming and prose style.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
