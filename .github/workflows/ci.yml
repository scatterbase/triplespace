# CI as ADR 0033 §2 specifies it: nextest, clippy -D warnings, cargo-deny, a wasm32 build of
# every rule-7 crate (0005 §3), and the dependency check against the 0005 §2 table; and the
# front end's lint, tests and build (0034 §8).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No RUSTFLAGS here: an environment RUSTFLAGS overrides every `rustflags` in
  # .cargo/config.toml, including the getrandom cfg the wasm32 build needs. Clippy's
  # `-D warnings` below covers rustc's lints as well.

jobs:
  check:
    name: Build, test and lint
    runs-on: ubuntu-latest
    services:
      # scatter-log-postgres's integration tests run against a real database (0033 §4,
      # §15); Postgres 18 is the target version (0033 §4).
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRIPLESPACE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # The toolchain, components and targets come from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-hack
      - name: Format
        run: cargo fmt --all --check
      - name: Dependency graph matches ADR 0005 §2
        run: cargo xtask deps
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo nextest run --workspace
      - name: Doc tests
        run: cargo test --workspace --doc
      - name: Rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Feature powerset
        run: cargo hack check --workspace --feature-powerset --no-dev-deps
      - name: wasm32 build of rule-7 crates
        run: cargo xtask wasm

  frontend:
    name: Front end (ui/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # ESLint, Stylelint and banana-checker over i18n/ (0034 §8–9).
      - run: npm run lint
      - run: npm test
      # The manifest and hashed files that triplespace-ui embeds.
      - run: npm run build

  e2e:
    name: End to end (two web replicas, JavaScript off, axe)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRIPLESPACE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # ui/dist first: the binaries embed it.
      - name: Front end
        working-directory: ui
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Binaries
        run: cargo build -p triplespace-cli -p triplespace-server -p triplespace-web
      - name: Browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Suite
        working-directory: ui
        run: npm run e2e

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  adrs:
    name: ADR cross-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ADR checks (0050 §12)
        run: |
          python3 docs/decisions/check_adrs.py docs | tee adr-report.txt
          # Every line the checker lists under a file is a problem: broken links, header
          # asymmetry, § and A/Q citations that do not exist, and a stale INDEX.md.
          ! grep -q "^   - " adr-report.txt
      - name: Log test vectors (payloads.md §1–2)
        run: python3 docs/api/vectors/check.py
