# CI as ADR 0033 §2 specifies it: nextest, clippy -D warnings, cargo-deny, a wasm32 build of
# every rule-7 crate (0005 §3), and the dependency check against docs/registry/crates.toml (22 §2.1); the
# front end's lint, tests and build (0034 §8); and the Wikibase client libraries against a
# running server (test plan §1.3–1.5, tools/client_compat.sh).
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No RUSTFLAGS here: an environment RUSTFLAGS overrides every `rustflags` in
  # .cargo/config.toml, including the getrandom cfg the wasm32 build needs. Clippy's
  # `-D warnings` below covers rustc's lints as well.

jobs:
  check:
    name: Build, test and lint
    runs-on: ubuntu-latest
    services:
      # scatter-log-postgres's integration tests run against a real database (0033 §4,
      # §15); Postgres 18 is the target version (0033 §4).
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRIPLESPACE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      # The toolchain, components and targets come from rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,cargo-hack
      - name: Format
        run: cargo fmt --all --check
      - name: Dependency graph matches ADR 0005 §2
        run: cargo xtask deps
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Test
        run: cargo nextest run --workspace
      - name: Doc tests
        run: cargo test --workspace --doc
      - name: Rustdoc
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Feature powerset
        run: cargo hack check --workspace --feature-powerset --no-dev-deps
      - name: wasm32 build of rule-7 crates
        run: cargo xtask wasm

  frontend:
    name: Front end (ui/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      # ESLint, Stylelint and banana-checker over i18n/ (0034 §8–9).
      - run: npm run lint
      - run: npm test
      # The manifest and hashed files that triplespace-ui embeds.
      - run: npm run build

  e2e:
    name: End to end (two web replicas, JavaScript off, axe)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRIPLESPACE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # ui/dist first: the binaries embed it.
      - name: Front end
        working-directory: ui
        run: npm ci && npm run build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Binaries
        run: cargo build -p triplespace-cli -p triplespace-server -p triplespace-web
      - name: Browser
        working-directory: ui
        run: npx playwright install --with-deps chromium
      - name: Suite
        working-directory: ui
        run: npm run e2e

  clients:
    name: Client compatibility (WikibaseIntegrator, Pywikibot, WikidataIntegrator)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRIPLESPACE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      # No ui/dist: the server runs with its site off, and triplespace-ui builds without it.
      - name: Binaries
        run: cargo build -p triplespace-cli -p triplespace-server
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements-compat.txt
      # The three clients, pinned (tools/requirements-compat.txt); a bump is a deliberate
      # change recorded in the test plan's log.
      - name: Clients
        run: pip install -r tools/requirements-compat.txt
      # A database loaded from the Librarybase sample fixture, the API, a bot key, and the
      # three checks; any failing check fails the job, WikidataIntegrator included.
      - name: Checks
        run: tools/client_compat.sh
      # The permission model's attack battery against a second fresh server (09 §4–§5): every
      # leak, escalation or false denial is a finding, and any finding fails the job.
      - name: Permission model
        run: tools/acl_check.sh

  deny:
    name: Licences and advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  adrs:
    name: ADR cross-references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Documentation checks (ADRs and chapters 24 §12, settings 0085 §1, crate map 24 §11, log vectors)
        run: docs/check.sh

  adr-preview:
    # A new ADR's text lives in the chapters (24 §3.2), so its pull request shows chapter hunks
    # and a skeleton. This posts the ADR assembled with its chapter text as one comment, updated
    # on every push, so a reviewer reads one document (0098 Q3).
    name: ADR preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble every ADR this pull request adds
        id: assemble
        run: |
          added=$(git diff --name-only --diff-filter=A "origin/${{ github.base_ref }}...HEAD" -- 'docs/decisions/[0-9][0-9][0-9][0-9]-*.md' || true)
          {
            echo '<!-- adr-preview -->'
            if [ -z "$added" ]; then
              echo 'This pull request adds no ADR.'
            fi
            for f in $added; do
              n=$(basename "$f" | cut -c1-4)
              echo "<details><summary><b>ADR $n</b> assembled with its chapter text (<code>tools/adr.py show $n --full</code>)</summary>"
              echo
              python3 tools/adr.py show "$n" --full
              echo
              echo '</details>'
              echo
            done
          } > preview.md
          echo "added=$(echo $added | wc -w)" >> "$GITHUB_OUTPUT"
      - name: Post or update the comment
        if: steps.assemble.outputs.added != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('preview.md', 'utf8');
            const marker = '<!-- adr-preview -->';
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {owner, repo, issue_number});
            const mine = comments.find(c => c.body && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({owner, repo, comment_id: mine.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
