[package]
name = "scatter-keyed"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Keyed entity types for Wikibase: entities identified by a normalized natural key (domains, keywords, notations), with their registry, grammars and normalizers"
readme = "README.md"
homepage = "https://triplespace.readthedocs.io/"
keywords = ["wikibase", "wikidata", "normalization", "identifiers", "rdf"]
categories = ["text-processing", "encoding"]
# Published on crates.io (0115 §1, §11); the registry files and LICENSE are symlinks into the
# repository, which `cargo package` stores as files (0115 §2).

[dependencies]
scatter-normalize.workspace = true
oxrdf.workspace = true
percent-encoding.workspace = true
unicode-normalization.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

# oxrdf → rand → getrandom needs the JavaScript backend in the browser (.cargo/config.toml).
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
