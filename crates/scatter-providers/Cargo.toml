[package]
name = "scatter-providers"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The provider registry: codes, slugs, numbers, type codes, ID grammars, IRI templates and ID rewriting"
readme = "README.md"
homepage = "https://triplespace.readthedocs.io/"
keywords = ["wikibase", "wikidata", "identifiers", "rdf", "registry"]
categories = ["data-structures", "parser-implementations"]
# Published on crates.io as Triplespace's opinionated provider model (0115 §14); the registry
# file and LICENSE are symlinks into the repository, which `cargo package` stores as files
# (0115 §2).

[dependencies]
oxrdf.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

# oxrdf → rand → getrandom needs the JavaScript backend in the browser (.cargo/config.toml).
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[lints]
workspace = true
