[package]
name = "scatter-normalize"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Keyed entity types and their normalizers, normalized value keys, the URL normalizer and resolver normalizers"
publish = false

[dependencies]
oxrdf.workspace = true
idna.workspace = true
url.workspace = true
percent-encoding.workspace = true
unicode-normalization.workspace = true
icu_casemap.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

# oxrdf → rand → getrandom needs the JavaScript backend in the browser (.cargo/config.toml).
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

