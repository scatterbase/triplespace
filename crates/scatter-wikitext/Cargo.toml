[package]
name = "scatter-wikitext"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Render MediaWiki wikitext to sanitized HTML, and extract its links, categories and sections, with source positions and no I/O"
readme = "README.md"
homepage = "https://triplespace.readthedocs.io/"
keywords = ["mediawiki", "wikitext", "wikipedia", "html", "renderer"]
categories = ["parser-implementations", "text-processing", "web-programming"]
# Published on crates.io (0115 §1, §3); LICENSE is a symlink into the repository, which
# `cargo package` stores as a file (0115 §2).

[dependencies]
scatter-wikitext-parse.workspace = true
ammonia.workspace = true

[dev-dependencies]
scatter-wikitext-expand.workspace = true
html5ever.workspace = true
markup5ever_rcdom.workspace = true
serde_json.workspace = true

[lints]
workspace = true
