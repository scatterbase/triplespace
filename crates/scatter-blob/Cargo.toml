[package]
name = "scatter-blob"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "The blob store over its own backend trait and the fs backend: storage scopes, the content-addressed key layout, streaming SHA-256 and SHA-1, copy-if-absent, ranged and streamed reads, prefix deletion, and listing"
publish = false

[dependencies]
bytes = "1"
futures = "0.3"
percent-encoding.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt"] }
sha2.workspace = true
sha1.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
thiserror.workspace = true

[lints]
workspace = true
