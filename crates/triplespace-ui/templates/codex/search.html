<div class="cdx-search-input cdx-search-input--has-end-button">
	<div class="cdx-search-input__input-wrapper">
		<div class="cdx-text-input">
			<input class="cdx-text-input__input" type="search" name="{{ name }}" value="{{ value }}" placeholder="{{ placeholder }}" aria-label="{{ label }}">
		</div>
	</div>
	<button type="submit" class="cdx-button cdx-search-input__end-button">{{ button }}</button>
</div>
