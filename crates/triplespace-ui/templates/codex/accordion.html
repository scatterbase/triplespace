<details class="cdx-accordion"{% if open %} open{% endif %}>
	<summary><span class="cdx-accordion__header"><span class="cdx-accordion__header__title">{{ title }}</span>{% if let Some(d) = description %}<span class="cdx-accordion__header__description">{{ d }}</span>{% endif %}</span></summary>
	<div class="cdx-accordion__content">{{ content|safe }}</div>
</details>
