[package]
name = "scatter-wikibase-rdf"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Wikibase RDF format 1.0.0: an entity's triples in the full and truthy flavors, the dump header, and N-Triples and Turtle"
publish = false

[dependencies]
scatter-wikibase-model.workspace = true
scatter-vocab.workspace = true
scatter-providers.workspace = true
scatter-normalize.workspace = true
oxrdf.workspace = true
oxttl.workspace = true
sha2.workspace = true

# oxrdf → rand → getrandom needs the JavaScript backend in the browser (.cargo/config.toml).
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
