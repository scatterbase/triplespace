[package]
name = "scatter-wikibase-rdf"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Wikibase RDF format 1.0.0: an entity's triples in the full and truthy flavors, the dump header, and N-Triples and Turtle"
readme = "README.md"
homepage = "https://triplespace.readthedocs.io/"
keywords = ["wikibase", "wikidata", "rdf", "sparql", "linked-data"]
categories = ["encoding", "parser-implementations"]
# Published on crates.io (0115 §1, §15); LICENSE is a symlink into the repository.

[dependencies]
scatter-wikibase-model.workspace = true
scatter-vocab.workspace = true
oxrdf.workspace = true
oxttl.workspace = true
sha2.workspace = true

# oxrdf → rand → getrandom needs the JavaScript backend in the browser (.cargo/config.toml).
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
