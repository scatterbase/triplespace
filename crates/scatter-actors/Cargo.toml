[package]
name = "scatter-actors"
version = "0.0.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Actors, issuers and permissions: actor keys and IRIs, actor records, account links and signing keys; groups, memberships, blocks, ACLs and their evaluation"
publish = false

[dependencies]
oxrdf.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true

# oxrdf → rand → getrandom needs the JavaScript backend in the browser (.cargo/config.toml).
[target.'cfg(target_family = "wasm")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[lints]
workspace = true
